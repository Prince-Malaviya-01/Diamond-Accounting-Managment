version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: diamond-postgres
    environment:
      POSTGRES_DB: diamond
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
